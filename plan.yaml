project: "Fintech MVP - Gestión de Movimientos"
version: "1.0.0"

phases:
  - phase_1: "Desarrollo de Base de Datos"
    status: "completed"
    tasks:
      - id: "DB-01"
        name: "Desarrollo del schema.sql"
      - id: "DB-02"
        name: "Creación de docker-compose para servicios locales"
      - id: "DB-03"
        name: "Verificación de levantamiento correcto"

- phase_2: "Desarrollo del Backend (FastAPI)"
    status: "pending"
    tasks:
      - id: "BACK-01"
        name: "Configuración inicial y estructura del proyecto FastAPI"
      - id: "BACK-02"
        name: "Definición y creación de la suite de pruebas (TDD) para todos los servicios"
      - id: "BACK-03"
        name: "Desarrollo de Autenticación Segura y Gestión de Sesión"
      - id: "BACK-04"
        name: "Desarrollo de Endpoints CRUD: Usuarios"
      - id: "BACK-05"
        name: "Desarrollo de Endpoints CRUD: Categorías"
      - id: "BACK-06"
        name: "Desarrollo de Endpoints CRUD: Transacciones y Filtros Avanzados"
      - id: "BACK-07"
        name: "Desarrollo de Servicios de Lógica de Negocio (Balance y Alertas)"

  - phase_3: "Desarrollo del Frontend (Next.js)"
    status: "pending"
    tasks:
      - id: "FRONT-01"
        name: "Configuración inicial y layout base de Next.js"
      - id: "FRONT-02"
        name: "Páginas de Login, Signup y Protección de Rutas"
      - id: "FRONT-03"
        name: "Componente Navbar General"
      - id: "FRONT-04"
        name: "Página de Listado de Categorías y Métricas"
      - id: "FRONT-05"
        name: "Modal de Creación/Edición de Categorías"
      - id: "FRONT-06"
        name: "Página de Listado de Movimientos (Filtros, Paginación y Balance)"
      - id: "FRONT-07"
        name: "Modal de Creación/Edición de Transacciones e Integración de Alertas"

  - phase_4: "Desarrollo de Pipelines (CI/CD)"
    status: "pending"
    tasks:
      - id: "PIPE-01"
        name: "Configuración de GitHub Actions para Tests Automáticos"
      - id: "PIPE-02"
        name: "Integración de análisis estático con SonarQube"
      - id: "PIPE-03"
        name: "Integración de análisis de vulnerabilidades con Trivy"

  - phase_5: "Despliegue en Nube"
    status: "pending"
    tasks:
      - id: "CLOUD-01"
        name: "Despliegue de DB en Neon"
      - id: "CLOUD-02"
        name: "Despliegue de Backend en Render"
      - id: "CLOUD-03"
        name: "Despliegue de Frontend en Vercel y Configuración de CORS/ENVs"