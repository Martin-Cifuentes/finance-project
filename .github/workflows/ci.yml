name: Fintech MVP CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend-tests:
    name: Backend Tests & Coverage (PIPE-01)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: finance_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        working-directory: finance-project-back
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Initialize Database
        run: |
          PGPASSWORD=pass psql -h localhost -p 5434 -U postgres -d finance_db -f finance-project-db/schema.sql

      - name: Run Pytest
        working-directory: finance-project-back
        run: |
          # Set up environment variables if needed
          export DATABASE_URL="postgresql://postgres:pass@localhost:5434/finance_db"
          pytest --cov=app --cov-report=xml tests/
          
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: finance-project-back/coverage.xml

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Build Frontend
        working-directory: finance-project-front
        run: |
          npm ci
          npm run build

  sonarcloud:
    name: SonarQube Analysis (PIPE-02)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Martin-Cifuentes_finance-project
            -Dsonar.organization=martin-cifuentes
            -Dsonar.python.coverage.reportPaths=finance-project-back/coverage.xml
            -Dsonar.sources=finance-project-back/app,finance-project-front/src
            -Dsonar.tests=finance-project-back/tests

  trivy-security:
    name: Trivy Security Scan (PIPE-03)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
